services:
  # 단일 전략 운용 (Phase 5 드라이런 기본값). 포트폴리오 분산 운용은 아래
  # freqtrade-trend / freqtrade-meanreversion 두 서비스를 대신 사용하세요
  # (docker compose up freqtrade-trend freqtrade-meanreversion).
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-binance
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ./config_binance.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy MultiConfluenceStrategy

  # --- Phase 6: 포트폴리오 (추세추종 + 평균회귀 동시 운용) ---
  freqtrade-trend:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-trend
    restart: unless-stopped
    profiles: ["portfolio"]
    env_file:
      - ../.env
    volumes:
      - ./config_trend.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8081:8081"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy MultiConfluenceStrategy

  freqtrade-meanreversion:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-meanreversion
    restart: unless-stopped
    profiles: ["portfolio"]
    env_file:
      - ../.env
    volumes:
      - ./config_meanreversion.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8082:8082"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy MeanReversionStrategy

  # --- 선물(futures, 롱+숏, 레버리지) — 기본적으로 절대 같이 안 뜸.
  # 반드시 명시적으로 "docker compose --profile futures up" 으로만 실행됨.
  # config의 "leverage" 값으로 레버리지 조절 (기본 2배, 원하면 config json 직접 수정).
  freqtrade-trend-futures:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-trend-futures
    restart: unless-stopped
    profiles: ["futures"]
    env_file:
      - ../.env
    # 컨테이너 안에서 "host.docker.internal"로 호스트(대시보드 서버)를 부를 수 있게 함
    # -> 한글 텔레그램 알림용 /webhook 릴레이(dashboard/server.py)를 호출하는 데 사용
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config_trend_futures.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8083:8083"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy MultiConfluenceStrategy

  freqtrade-meanreversion-futures:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-meanreversion-futures
    restart: unless-stopped
    profiles: ["futures"]
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config_meanreversion_futures.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8084:8084"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy MeanReversionStrategy

  # --- Phase 8: 박스권 돌파 전략 (BoxBreakoutStrategy) ---
  # 기존 두 전략(추세추종/평균회귀)은 2026-08-27 검증에서 진입 신호에 통계적
  # 엣지가 없음이 확인되어 이 전략으로 교체하는 것을 전제로 추가됨.
  # 이 서비스만 띄우려면:
  #   docker compose --profile futures up -d freqtrade-boxbreakout-futures
  freqtrade-boxbreakout-futures:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-boxbreakout-futures
    restart: unless-stopped
    profiles: ["futures"]
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config_boxbreakout_futures.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8085:8085"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy BoxBreakoutStrategy

  # --- BoxBreakoutV2: 박스 경계 손절 + 익절 20% + 거래대금 상위 20개 자동 선정 ---
  # 검증 전이므로 config가 dry_run=true, initial_state=stopped 로 되어 있다.
  # 기동해도 매매를 시작하지 않으며, 대시보드 버튼으로만 시작된다.
  freqtrade-boxbreakout-v2-futures:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-boxbreakout-v2-futures
    restart: unless-stopped
    profiles: ["futures"]
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 파일 하나짜리 bind mount라 컨테이너는 이 파일의 inode를 붙잡고 있다.
      # sed -i 처럼 파일을 새로 만들어 갈아끼우는 방식으로 고치면 컨테이너는
      # 계속 옛날 내용을 보게 된다 (2026-08-31 max_open_trades 변경 때 겪음).
      # 설정을 바꾼 뒤에는 반드시 컨테이너를 recreate 할 것:
      #   docker compose up -d --force-recreate freqtrade-boxbreakout-v2-futures
      # 그리고 initial_state가 stopped라 재생성 후엔 봇이 정지 상태로 뜨므로
      # 대시보드 전원 버튼이나 /api/v1/start 로 다시 켜야 한다.
      - ./config_boxbreakout_v2_futures.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8086:8086"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy BoxBreakoutV2Strategy

  # 횡단면 모멘텀 (시장중립 롱숏). 2026-09-03 추가.
  # 다른 전략들과 달리 페어 전체를 줄 세워야 하므로 감시 페어가 19개다.
  # 같은 바이낸스 계좌를 BoxBreakoutV2 와 공유하므로 증거금이 서로 경쟁한다 -
  # 둘 다 켜두면 어느 쪽도 필요한 만큼 못 여는 상황이 생길 수 있다.
  freqtrade-xsect-momentum-futures:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-xsect-momentum-futures
    restart: unless-stopped
    profiles: ["futures"]
    env_file:
      - ../.env
    environment:
      # .env 의 FREQTRADE__TELEGRAM__ENABLED 가 config 를 덮어쓰기 때문에,
      # 여기서 다시 꺼야 한다. 텔레그램 토큰은 하나뿐이라 두 봇이 동시에
      # getUpdates 를 폴링하면 Conflict 로 계속 에러가 난다.
      # 알림은 webhook -> 대시보드 릴레이로 나가므로 이걸 꺼도 알림은 온다.
      - FREQTRADE__TELEGRAM__ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 설정은 파일 하나짜리 bind mount다. 수정 후에는 반드시 recreate 할 것
      # (sed -i 로 고치면 inode가 바뀌어 컨테이너가 옛 내용을 계속 읽는다).
      #
      # *** 로컬 저장소의 config_xsect_momentum_futures.json 을 그대로 scp로
      # 덮어쓰지 말 것. *** 민감정보(jwt_secret_key, api_server 계정, webhook
      # secret)는 커밋 안 하려고 로컬 파일엔 빈 값/REPLACE_WITH_... placeholder가
      # 들어있다. 실제로 이걸 그대로 올렸다가 webhook secret이 placeholder로
      # 되돌아가서 텔레그램 알림이 조용히 끊긴 적이 있다(대시보드가 403을
      # 받고도 별다른 경고 없이 넘어가는 구조라 한동안 못 알아챘다).
      # 설정 필드 하나만 바꿀 땐 서버에서 python -c 등으로 그 필드만 직접
      # 고치고, 로컬 파일을 올려야 한다면 반드시 서버의 boxbreakout_v2 config
      # (또는 이전 xsect config 백업)에서 jwt_secret_key/api_server 계정/webhook
      # 값을 다시 이식한 뒤 recreate 할 것.
      - ./config_xsect_momentum_futures.json:/freqtrade/user_data/config.json
      - ./strategies:/freqtrade/user_data/strategies
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8087:8087"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy XSectMomentumStrategy

  # 예전엔 XRP를 별도 봇 인스턴스(freqtrade-trend-xrp-futures 등)로 분리했었으나,
  # 계좌 잔고를 추세추종/평균회귀 계열끼리 공유하기 위해 통합함. 지금은
  # MultiConfluenceStrategy/MeanReversionStrategy 안에서 페어가 XRP일 때만
  # XRP 전용 파라미터(XRP_PARAMS)로 분기하는 방식으로 대체됨 (strategies/*.py 참고).
